name: lago
description: >-
  Lago, the open source billing system, through its OWN API — never the database. A customer
  is a BillingCustomer, a subscription a BillingSubscription and an invoice a BillingInvoice
  of the business vocabulary (realm-business-vocabulary, installed first), so a question asked
  about billing is answered here without naming Lago. A Lago customer also keys the
  CustomerAccount spine by its url, which is how an account the CRM knows reaches what
  billing knows about it. Every type is virtual: nothing is mirrored, and a change made in
  Lago's own UI is what the next query sees.
version: 0.1.0
# Works and reconciles against Lago; the realms that make it useful are still being built, and
# part of the vocabulary's contract cannot be met yet (see the README).
maturity: experimental
author: Rod Johnson
category: finance
tags:
  - integrations
  - billing
